name: Build Droidspaces GKI 5.15.178

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  ARTIFACT_NAME: android13-5.15.178-2025-03-AnyKernel3.zip
  RELEASE_TAG: droidspaces-android13-5.15.178-2025-03

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-swapfile: "true"
          verbose: "true"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache curl git python3 unzip zip
          pip install PyYAML

      - name: Configure ccache
        run: |
          mkdir -p ~/.cache/bazel ~/.ccache
          ccache --max-size=2G
          ccache --set-config=compression=true

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: android13-5.15.178-ccache-${{ github.sha }}
          restore-keys: android13-5.15.178-ccache-

      - name: Build kernel
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          python3 .github/workflows/scripts/build.py \
            --android android13 \
            --kernel 5.15 \
            --sub-level 178 \
            --os-patch 2025-03 \
            --no-release

      - name: Collect the only release artifact
        run: |
          source_file="/tmp/gki-build/android13-5.15-178/${ARTIFACT_NAME}"
          test -f "$source_file"
          mkdir -p release
          cp "$source_file" "release/${ARTIFACT_NAME}"
          cd release
          sha256sum "${ARTIFACT_NAME}" | tee SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: droidspaces-kernel
          path: release/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: droidspaces-kernel
          path: release

      - name: Verify artifact
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt

      - name: Prepare release notes
        run: |
          checksum="$(cut -d' ' -f1 release/SHA256SUMS.txt)"
          {
            echo "Droidspaces-enabled GKI kernel for Android 13."
            echo
            echo "- Kernel: 5.15.178"
            echo "- OS patch: 2025-03"
            echo "- SukiSU Ultra + SUSFS"
            echo "- Droidspaces SYSVIPC kABI patch and recommended GKI configuration"
            echo "- SHA-256: $checksum"
          } > RELEASE_BODY.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Droidspaces GKI 5.15.178 (2025-03)
          draft: false
          generate_release_notes: false
          body_path: RELEASE_BODY.md
          files: release/${{ env.ARTIFACT_NAME }}
